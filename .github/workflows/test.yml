name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

  integration:
    name: Integration (ES ${{ matrix.es-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.11.4 is not redundant with 8.19.20. Elastic relaxed the _shard_doc
        # validation during the 8.x line: 8.11.4 rejects `_shard_doc` outside a
        # point-in-time with HTTP 400, while 8.19.20 and 9.5.1 accept it. A
        # matrix of only the latest releases goes green on the very bug this
        # suite exists to catch, so keep the oldest supported version pinned.
        es-version: ["8.11.4", "8.19.20", "9.5.1"]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.es-version }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          xpack.license.self_generated.type: basic
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 45s
    env:
      ES_TEST_URL: http://localhost:9200
      ES_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Wait for Elasticsearch
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; then
              curl -s http://localhost:9200
              exit 0
            fi
            sleep 5
          done
          echo "Elasticsearch did not become ready"
          exit 1

      - name: Run integration tests
        run: |
          python -m unittest discover -s tests -t . -p "test_integration_*.py" -v

  kibana-event-log:
    name: Kibana event-log integration (8.19.20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Start Elasticsearch and Kibana 8.19.20 stack
        run: docker compose -f docker-compose.kibana-test.yml up -d

      - name: Verify real Kibana event-log documents
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          set -euo pipefail
          python scripts/verify_kibana_event_log.py

      - name: Tear down Elasticsearch and Kibana stack
        if: always()
        run: |
          docker compose -f docker-compose.kibana-test.yml logs --no-color
          docker compose -f docker-compose.kibana-test.yml down --volumes --remove-orphans
