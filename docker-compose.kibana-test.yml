services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.20
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "edwin-elastic-poller-local-test-encryption-key-32"
      XPACK_REPORTING_ENCRYPTIONKEY: "edwin-elastic-poller-local-test-reporting-key-32"
      XPACK_SECURITY_ENCRYPTIONKEY: "edwin-elastic-poller-local-test-security-key-32"
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      NEWSFEED_ENABLED: "false"
      XPACK_FLEET_ISAIRGAPPED: "true"
      XPACK_OBSERVABILITYAIASSISTANT_ENABLED: "false"
    ports:
      - "5601:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:5601/api/status",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana-test-setup:
    image: python:3.12-slim
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      KIBANA_TEST_INDEX: edwin-elastic-poller-kibana-test
      KIBANA_TEST_RULE_NAME: edwin-elastic-poller-kibana-test-rule
    volumes:
      - ./scripts/kibana_test_setup.py:/opt/kibana_test_setup.py:ro
    command: ["python", "/opt/kibana_test_setup.py"]
